services:
  mlflow:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.16.2 &&
               mlflow server --backend-store-uri file:./mlruns
               --default-artifact-root file:./mlruns
               --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"

  api:
    build: .
    depends_on:
      - mlflow
    volumes:
      - ./mlruns:/app/mlruns
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=file:./mlruns
